<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{width:1024px;height:700px;border:0}
#out{position:fixed;left:0;top:0;background:#fff;color:#000;font:11px monospace;z-index:9;width:100%;white-space:pre-wrap;word-break:break-all}</style></head><body>
<pre id="out">waiting</pre>
<iframe id="f3" src="/"></iframe>
<script>
function run(){
  const d=document.getElementById('f3').contentDocument;
  const out=[];
  out.push('innerW='+d.documentElement.clientWidth+' bodyW='+d.body.clientWidth);
  let el=d.querySelector('main');
  while(el){
    const r=el.getBoundingClientRect();
    out.push(el.tagName+' cls='+(el.className||'').slice(0,90)+' w='+Math.round(r.width)+' maxW='+getComputedStyle(el).maxWidth);
    el=el.firstElementChild;
  }
  const sec=d.querySelector('section');
  if(sec){const r=sec.getBoundingClientRect();out.push('SECTION cls='+sec.className+' w='+r.width+' maxW='+getComputedStyle(sec).maxWidth+' display='+getComputedStyle(sec).display);}
  const h1=d.querySelector('h1');
  if(h1){const cs=getComputedStyle(h1);out.push('H1 fs='+cs.fontSize+' ff='+cs.fontFamily+' fw='+cs.fontWeight+' w='+Math.round(h1.getBoundingClientRect().width));}
  document.getElementById('out').textContent=out.join('\n');
}
setTimeout(run,4000);
</script></body></html>
