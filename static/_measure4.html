<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{width:1024px;height:700px;border:0}
#out{position:fixed;left:0;top:0;background:#fff;color:#000;font:20px monospace;z-index:9;width:100%;white-space:pre-wrap}</style></head><body>
<pre id="out">waiting</pre>
<iframe id="f3" src="/"></iframe>
<script>
function run(){
  const d=document.getElementById('f3').contentDocument;
  const w=d.defaultView;
  const o=[];
  const sec=d.querySelector('section');
  const cs=w.getComputedStyle(sec);
  o.push('secW='+Math.round(sec.getBoundingClientRect().width));
  o.push('secMaxW='+cs.maxWidth);
  o.push('secDisplay='+cs.display);
  o.push('secWidthProp='+cs.width);
  o.push('parentDisplay='+w.getComputedStyle(sec.parentElement).display);
  o.push('parentAlign='+w.getComputedStyle(sec.parentElement).alignItems);
  o.push('parentW='+Math.round(sec.parentElement.getBoundingClientRect().width));
  o.push('secAlignSelf='+cs.alignSelf);
  // test a fresh div with max-w-4xl
  const t=d.createElement('div');t.className='max-w-4xl';t.style.height='3px';d.body.appendChild(t);
  o.push('testMaxW4xl='+w.getComputedStyle(t).maxWidth+' w='+Math.round(t.getBoundingClientRect().width));
  const t2=d.createElement('div');t2.className='max-w-4xl flex flex-col';d.body.appendChild(t2);
  o.push('test2MaxW4xl='+w.getComputedStyle(t2).maxWidth);
  document.getElementById('out').textContent=o.join('\n');
}
setTimeout(run,5000);
</script></body></html>
