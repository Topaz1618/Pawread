{% extends "base.html" %}
{% block title %}Pawread{% end %}

{% block body %}
<main class="w-full pt-20">
  <div class="max-w-[1440px] mx-auto px-space-md lg:px-margin py-space-xl">
    <div class="flex flex-col w-full gap-space-xl">

      <!-- Hero：与 templates/faq.html 一致 -->
      <section class="relative flex flex-col items-center text-center max-w-4xl mx-auto">
        <div class="pointer-events-none absolute -top-10 left-1/4 w-96 h-96 bg-pink-200/40 rounded-full blur-3xl -z-10"></div>
        <div class="pointer-events-none absolute top-2 right-1/4 w-80 h-80 bg-purple-200/30 rounded-full blur-3xl -z-10"></div>
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#fce7f3]/80 backdrop-blur-md shadow-sm mb-6">
          <span class="w-1.5 h-1.5 rounded-full bg-[#000000] animate-ping"></span>
          <span class="font-label-sm text-label-sm uppercase tracking-widest text-[#000000] font-semibold" data-i18n="lib.badge"></span>
        </div>
        <h1 class="font-headline-xl text-headline-xl text-[#000000] tracking-tight mb-4" style="font-family: 'Syne', sans-serif;" data-i18n="lib.title"></h1>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl leading-relaxed" data-i18n="lib.desc"></p>

        <!-- 搜索悬浮胶囊：与 templates/faq.html 一致 -->
        <div class="w-full max-w-2xl mt-8 relative">
          <div class="relative flex items-center bg-white/90 backdrop-blur-2xl rounded-full shadow-[0_12px_36px_-8px_rgba(252,231,243,0.7)] p-2 transition-all focus-within:shadow-[0_16px_44px_-6px_rgba(243,232,255,0.9)]">
            <div class="w-12 h-12 flex items-center justify-center rounded-full bg-[#fdf2f8] text-[#000000] ml-1">
              <span class="material-symbols-outlined text-xl">search</span>
            </div>
            <input class="w-full px-4 py-3 bg-transparent text-[#000000] placeholder:text-on-surface-variant/50 font-body-lg text-body-lg focus:outline-none"
                   id="searchInput" type="text" data-i18n-ph="lib.search"/>
          </div>
        </div>
      </section>

      <!-- Filter & Search Toolbar：与 templates/orders.html 完全一致 -->
      <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-space-md p-space-sm rounded-lg bg-surface-container-lowest/60 backdrop-blur-xl shadow-[0_4px_16px_rgba(0,0,0,0.02)]">
        <!-- Filter Pills Tabs -->
        <div class="flex items-center gap-space-xs overflow-x-auto pb-1 lg:pb-0 scrollbar-none" id="stateFilters"></div>
        <!-- Search Input -->
        <div class="relative min-w-[280px]">
          <span class="material-symbols-outlined text-outline absolute left-space-md top-1/2 -translate-y-1/2 text-[18px]">search</span>
          <input class="w-full pl-10 pr-space-md py-2 rounded-full bg-surface-container-low/80 border border-pink-100/60 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-white focus:border-pink-300 transition-all"
                 id="toolbarSearch" type="text" data-i18n-ph="lib.search"/>
        </div>
      </div>

      <!-- Orders Container (Rich Frosted Rows)：与 templates/orders.html 完全一致 -->
      <div class="flex flex-col gap-space-md" id="libList"></div>

      <!-- Pagination Strip：与 templates/orders.html 完全一致 -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-space-md py-space-sm px-space-md rounded-full bg-surface-container-lowest/60 backdrop-blur-md">
        <span class="font-label-md text-label-md text-on-surface-variant" id="paginationCountText">Showing <strong>0</strong> of <strong>0</strong> books</span>
        <div class="flex items-center gap-space-xs">
          <button class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-outline cursor-not-allowed" disabled=""><span class="material-symbols-outlined text-[18px]">chevron_left</span></button>
          <button class="w-8 h-8 rounded-full bg-[#000000] text-white font-label-sm text-label-sm font-semibold flex items-center justify-center shadow-sm">1</button>
          <button class="w-8 h-8 rounded-full bg-surface-container-low flex items-center justify-center text-outline cursor-not-allowed" disabled=""><span class="material-symbols-outlined text-[18px]">chevron_right</span></button>
        </div>
      </div>

    </div>
  </div>
</main>
{% end %}

{% block scripts %}
<script src="/static/js/library.js"></script>
{% end %}
